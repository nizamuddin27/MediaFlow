name: MediaFlow Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automation
        run: python main.py
